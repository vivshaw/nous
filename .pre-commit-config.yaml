repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: ^(plugins/(core|extra)/hooks|plugins/research/skills/.*/scripts|tools)/(?!test_).*\.py$
        # Strictness is configured in pyproject.toml [tool.mypy].

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        files: ^(plugins/(core|extra)/hooks|plugins/research/skills/.*/scripts|tools)/.*\.py$

      - id: swatches-up-to-date
        name: swatches.html matches its generator
        entry: uv run python tools/build_swatches.py --check
        language: system
        pass_filenames: false
        files: ^(tools/build_swatches\.py|plugins/research/skills/visualizing-data/assets/swatches\.html)$
